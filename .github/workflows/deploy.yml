name: Mayura Jewellers CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  # ==========================================
  # STAGE 1: Continuous Integration (CI)
  # ==========================================
  build-and-test:
    name: 🧪 Build & Test Verification
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout Repository Code
        uses: actions/checkout@v4

      - name: 2. Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: 3. Install Dependencies
        run: npm install

      - name: 4. Build Next.js Production Bundle
        run: npm run build

  # ==========================================
  # STAGE 2: Continuous Deployment (CD)
  # ==========================================
  deploy-production:
    name: 🚀 Deploy to Vercel Production
    needs: build-and-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN || vars.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID || vars.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID || vars.VERCEL_PROJECT_ID }}

    steps:
      - name: 1. Checkout Repository Code
        uses: actions/checkout@v4

      - name: 2. Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 3. Install Vercel CLI
        run: npm install --global vercel@latest

      - name: 4. Validate Vercel Credentials
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "::error::VERCEL_TOKEN is not defined in GitHub! Please add it to GitHub Settings -> Secrets."
            exit 1
          fi
          echo "VERCEL_TOKEN is present."

      - name: 5. Pull Vercel Environment Configuration
        run: vercel pull --yes --environment=production --token="$VERCEL_TOKEN"

      - name: 6. Build Production Artifacts with Vercel
        run: vercel build --prod --token="$VERCEL_TOKEN"

      - name: 7. Deploy Prebuilt Artifacts to Vercel
        run: vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN"
